name: StageshowRunner
options:
  bundleIdPrefix: dev.benjify
  deploymentTarget:
    iOS: "27.0"
packages:
  StageshowKit:
    path: ../../StageshowKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  StageshowRunner:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../../examples
        group: examples
    dependencies:
      - package: StageshowKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.benjify.runner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stageshow Runner
  RunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StageshowRunner
      - package: StageshowKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.benjify.runner.tests
        OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-function-bodies=500 -Xfrontend -warn-long-expression-type-checking=500"
  RunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StageshowRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.benjify.runner.uitests
        TEST_TARGET_NAME: StageshowRunner
schemes:
  StageshowRunner:
    build:
      targets:
        StageshowRunner: all
    test:
      targets: [RunnerTests, RunnerUITests]
      gatherCoverageData: false
